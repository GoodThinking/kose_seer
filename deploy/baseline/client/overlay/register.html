<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邀请码注册 · 怀旧赛尔号</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#10222c;color:#173d57;font:16px "PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,480px);background:#eaf6ff;border:4px solid #73b5de;border-radius:22px;overflow:hidden;box-shadow:0 8px 0 #071923}
header{background:#2379b2;color:white;padding:26px 30px;border-bottom:4px solid #a7ddfc}.eyebrow{margin:0 0 8px;color:#d1eeff;font-size:13px;letter-spacing:.12em}h1{margin:0;font-size:28px}header p:last-child{margin:10px 0 0;line-height:1.6;color:#e2f4ff}
form{padding:26px 30px}label{display:block;margin:0 0 7px;font-weight:600}input{display:block;width:100%;border:2px solid #91b8d0;border-radius:8px;background:#fff;padding:12px;color:#163d56;font:inherit;margin-bottom:19px;min-width:0}input:focus{outline:3px solid #ffd05c;outline-offset:1px}
button{width:100%;font:700 18px inherit;font-family:inherit;font-size:18px;font-weight:700;color:#4a3005;background:#ffd26e;border:2px solid #d79728;border-radius:10px;padding:13px;cursor:pointer;box-shadow:0 3px 0 #b98025}button:disabled{opacity:.6;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #2379b2;outline-offset:3px}
#result{margin:20px 0 0;line-height:1.65;overflow-wrap:anywhere}#result.error{color:#9a3026}#result.success{color:#166747}footer{padding:0 30px 26px}a{color:#1d6fa2;font-weight:600}small{display:block;margin-top:-10px;margin-bottom:20px;color:#486f86;line-height:1.6}
@media(max-width:400px){body{padding:12px}header,form{padding:22px}h1{font-size:25px}footer{padding:0 22px 22px}}
</style></head><body><main><header><p class="eyebrow">SEER · 怀旧个人服</p><h1>欢迎登上赛尔号</h1><p>输入我们发给你的邀请码，创建自己的账号。</p></header>
<form id="register"><label for="email">登录邮箱</label><input id="email" name="email" type="email" maxlength="64" autocomplete="username" required><small>邮箱作为登录标识，无需接收邮件。</small>
<label for="password">密码</label><input id="password" name="password" type="password" minlength="6" maxlength="32" autocomplete="new-password" required><label for="confirm">确认密码</label><input id="confirm" type="password" maxlength="32" autocomplete="new-password" required>
<label for="invite">邀请码</label><input id="invite" name="invite" type="text" minlength="32" maxlength="32" pattern="[a-fA-F0-9]{32}" spellcheck="false" autocomplete="off" required><small>一次一码。没有邀请码，请联系发放人。</small>
<button id="submit" type="submit">创建账号</button><p id="result" role="status" aria-live="polite"></p></form><footer><a href="/">返回游戏登录</a></footer></main>
<script>
'use strict';
const form=document.getElementById('register'),button=document.getElementById('submit'),status=document.getElementById('result');
function message(text,kind='error'){status.className=kind;status.textContent=text}
form.addEventListener('submit',event=>{
 event.preventDefault();
 const email=form.email.value.trim(),password=form.password.value,invite=form.invite.value.trim().toLowerCase(),encode=new TextEncoder();
 if(password!==document.getElementById('confirm').value){message('两次密码不一致，请重新输入。');return}
 if(password!==password.trim()||encode.encode(password).length>32){message('密码不能以空格开头或结尾，且最多32字节。');return}
 if(encode.encode(email).length>64){message('登录邮箱过长，请使用64字节以内的邮箱。');return}
 button.disabled=true;message('正在创建账号…','');
 const ws=new WebSocket(location.origin.replace(/^http/,'ws')+'/socket');ws.binaryType='arraybuffer';let pending=true,buffer=new Uint8Array(0);
 const finish=(text,kind)=>{if(!pending)return;pending=false;clearTimeout(timer);button.disabled=kind==='success';message(text,kind);ws.close()};
 const timer=setTimeout(()=>finish('未收到注册结果，请先返回游戏尝试登录。不要重复提交，以免误用邀请码。','error'),15000);
 ws.onopen=()=>{const packet=new Uint8Array(177),view=new DataView(packet.buffer);view.setUint32(0,177);packet[4]=49;view.setUint32(5,2);packet.set(encode.encode(password),17);packet.set(encode.encode(email),49);packet.set(encode.encode(invite),113);ws.send(packet)};
 ws.onmessage=event=>{const incoming=new Uint8Array(event.data),joined=new Uint8Array(buffer.length+incoming.length);joined.set(buffer);joined.set(incoming,buffer.length);buffer=joined;while(buffer.length>=17){const view=new DataView(buffer.buffer,buffer.byteOffset,buffer.byteLength),length=view.getUint32(0);if(length<17||length>8388608){finish('服务响应异常，请稍后再试。','error');return}if(buffer.length<length)return;const cmd=view.getUint32(5),uid=view.getUint32(9),result=view.getInt32(13);buffer=buffer.slice(length);if(cmd!==2)continue;if(result===0&&uid>=100000000){form.password.value='';document.getElementById('confirm').value='';form.invite.value='';finish('注册成功！米米号：'+uid+'。返回游戏，用登录邮箱和刚才设置的密码登录。','success')}else{finish(result===5012?'邀请码无效、已使用或已过期，请联系发放人。':result===5002?'邮箱已注册，请返回游戏直接登录。':'注册未完成，请稍后再试；未成功提交不会消耗邀请码。','error')}}};
 ws.onerror=()=>finish('连接失败，请检查网络后重试。','error');
 ws.onclose=()=>{if(pending)finish('连接已断开，结果尚未确认。请先尝试登录，再决定是否重试。','error')};
});
</script></body></html>
