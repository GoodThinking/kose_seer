server {
    listen 18761 ssl;
    server_name edu.jingxi-tools.com;
    ssl_certificate /var/www/certs/edu.jingxi-tools.com.pem;
    ssl_certificate_key /var/www/certs/edu.jingxi-tools.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:18760;
        proxy_http_version 1.1;
        proxy_set_header Host edu.jingxi-tools.com:18761;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
